<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Startpage</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg: #1a1a2e;
            --surface: rgba(30, 30, 50, 0.85);
            --surface-hover: rgba(45, 45, 70, 0.95);
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #7c8cf8;
            --accent-hover: #9aa8ff;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', 'PingFang TC', 'PingFang SC', sans-serif;
        }

        /* ===== Reset ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, var(--glow1, rgba(124, 140, 248, 0.08)) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, var(--glow2, rgba(180, 100, 255, 0.06)) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            transition: background-color 0.25s, color 0.25s;
        }

        body[data-light="1"] {
            background-image:
                radial-gradient(ellipse at 20% 50%, var(--glow1, rgba(124, 140, 248, 0.15)) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, var(--glow2, rgba(180, 100, 255, 0.10)) 0%, transparent 50%);
        }

        /* ===== Top Bar ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--topbar-bg, rgba(26, 26, 46, 0.9));
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: background-color 0.25s;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 200px;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            white-space: nowrap;
            letter-spacing: -0.5px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 12px;
            flex: 1;
            max-width: 560px;
            transition: border-color 0.2s;
        }

        .search-box:focus-within { border-color: var(--accent); }

        .search-box input {
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.9rem;
            padding: 10px 8px;
            width: 100%;
            font-family: var(--font);
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box select {
            background: none;
            border: none;
            outline: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px;
            font-family: var(--font);
            max-width: 130px;
        }

        .search-box select option,
        .search-box select optgroup {
            background: var(--bg);
            color: var(--text);
            font-style: normal;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clock {
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-family: var(--font);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #fff;
        }

        .btn-icon { padding: 8px 10px; font-size: 1rem; line-height: 1; }

        .btn-danger { border-color: rgba(255, 80, 80, 0.3); color: #ff6b6b; }
        .btn-danger:hover {
            background: rgba(255, 80, 80, 0.15);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* ===== Page Tabs ===== */
        .page-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 24px;
            overflow-x: auto;
            flex-wrap: nowrap;
            border-bottom: 1px solid var(--border);
            background: var(--tabs-bg, rgba(26, 26, 46, 0.6));
        }

        .page-tabs::-webkit-scrollbar { height: 4px; }
        .page-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .page-tab {
            padding: 6px 16px;
            border-radius: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.82rem;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: var(--font);
            user-select: none;
        }

        .page-tab:hover { background: var(--surface-hover); color: var(--text); }
        .page-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .page-tab .tab-close { margin-left: 8px; opacity: 0.6; font-size: 0.9rem; }
        .page-tab .tab-close:hover { opacity: 1; }

        .page-tab-add {
            padding: 6px 12px;
            border-radius: 20px;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.82rem;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: var(--font);
        }

        .page-tab-add:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== Main Content ===== */
        .content {
            padding: 20px 24px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ===== Masonry 容器 ===== */
        .widgets-grid {
            position: relative;
            width: 100%;
        }

        /* ===== Widget Card ===== */
        .widget {
            --w-color: var(--accent);
            position: absolute;
            left: 0;
            top: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: border-color 0.2s, background-color 0.25s;
            will-change: left, top;
        }

        .widget:hover { border-color: var(--accent); }

        .widget[data-has-color="1"]::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--w-color), transparent 92%);
            pointer-events: none;
            z-index: 1;
        }

        .widget[data-has-color="1"] .widget-title { color: var(--w-color); }

        .widget[data-has-color="1"] .add-link-btn:hover {
            border-color: var(--w-color);
            color: var(--w-color);
            background: color-mix(in srgb, var(--w-color) 8%, transparent);
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            cursor: grab;
            user-select: none;
        }

        .widget-header:active { cursor: grabbing; }

        .widget-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .widget-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .widget:hover .widget-actions { opacity: 1; }

        .widget-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            transition: all 0.15s;
            font-family: var(--font);
        }

        .widget-action:hover { background: var(--surface-hover); color: var(--text); }
        .widget-action.delete:hover { color: #ff6b6b; }

        .widget-body { padding: 0 16px 16px; }

        /* ===== Link List (LIST view — default) ===== */
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.15s;
            cursor: pointer;
            position: relative;
        }

        .link-item:hover { background: var(--surface-hover); color: var(--text); }

        .link-item .link-favicon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .link-item .link-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-item .link-edit-actions { display: none; gap: 2px; }
        .link-item:hover .link-edit-actions { display: flex; }

        .link-item .link-edit-actions button {
            background: var(--surface-hover);
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            transition: all 0.15s;
            font-family: var(--font);
        }

        .link-item .link-edit-actions button:hover { color: var(--text); }
        .link-item .link-edit-actions button.del:hover { color: #ff6b6b; }

        /* ===== Link Grid (ICON view — per-widget) =====
           只作用于「该」widget：data-view="icons" 的卡片
           其它卡片照常显示列表 */
        .widget[data-view="icons"] .link-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
            gap: 6px;
        }

        .widget[data-view="icons"] .link-item {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 14px 6px 12px;
            text-align: center;
            min-height: 92px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: transparent;
        }

        .widget[data-view="icons"] .link-item:hover {
            border-color: var(--border);
            background: var(--surface-hover);
        }

        .widget[data-view="icons"] .link-item .link-favicon {
            width: 32px;
            height: 32px;
            border-radius: 7px;
        }

        .widget[data-view="icons"] .link-item .link-label {
            flex: none;
            width: 100%;
            font-size: 0.72rem;
            text-align: center;
            line-height: 1.25;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            white-space: normal;
            word-break: break-word;
        }

        .widget[data-view="icons"] .link-item .link-edit-actions {
            position: absolute;
            top: 2px;
            right: 2px;
            display: none;
            gap: 2px;
        }

        .widget[data-view="icons"] .link-item:hover .link-edit-actions { display: flex; }

        .widget[data-view="icons"] .link-item .link-edit-actions button {
            padding: 1px 4px;
            font-size: 0.62rem;
            background: var(--bg);
            opacity: 0.9;
        }

        .widget[data-view="icons"] .add-link-btn {
            grid-column: 1 / -1;
            justify-content: center;
            margin-top: 4px;
        }

        /* ===== Add Link Button ===== */
        .add-link-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            border: 1px dashed var(--border);
            background: none;
            transition: all 0.15s;
            margin-top: 4px;
            font-family: var(--font);
            width: 100%;
            text-align: left;
        }

        .add-link-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 8%, transparent);
        }

        /* ===== Add Widget Card ===== */
        .add-widget-card {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 110px;
            background: transparent;
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            font-family: var(--font);
            will-change: left, top;
        }

        .add-widget-card:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 6%, transparent);
        }

        /* ===== Colour Popover ===== */
        .color-pop {
            position: fixed;
            z-index: 3000;
            width: 216px;
            background: var(--pop-bg, #22223a);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
            animation: modalIn 0.15s ease;
        }

        .color-pop-title {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .color-pop-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            background: var(--sw);
            transition: transform 0.12s, border-color 0.12s;
            padding: 0;
        }

        .swatch:hover { transform: scale(1.12); }
        .swatch.active { border-color: var(--text); }

        .color-pop-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .swatch-custom {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .swatch-custom input[type=color] {
            width: 22px;
            height: 22px;
            border: none;
            padding: 0;
            background: none;
            cursor: pointer;
            border-radius: 6px;
        }

        .swatch-reset {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.72rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font);
        }

        .swatch-reset:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--modal-bg, #1e1e32);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.2s ease;
            color: var(--text);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h3 { font-size: 1.1rem; margin-bottom: 20px; color: var(--text); }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.88rem;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus { border-color: var(--accent); }

        .form-group select option { background: var(--bg); color: var(--text); }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--pop-bg, #2a2a45);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            z-index: 4000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ===== Drag & Drop ===== */
        .widget.dragging { opacity: 0.5; }
        .widget.drag-over { border-color: var(--accent); border-style: dashed; }

        /* ===== Link drag-to-reorder ===== */
        .link-item.dragging { opacity: 0.4; }
        .link-item.drop-ph {
            border: 2px dashed var(--accent);
            background: transparent;
            opacity: 0.5;
            pointer-events: none;
        }
        .widget[data-view="icons"] .link-item.drop-ph { min-height: 64px; }

        /* ===== Widget drop onto page tab ===== */
        .page-tab.drag-over { border-color: var(--accent); background: var(--surface-hover); color: var(--text); }

        /* ===== Settings Panel ===== */
        .settings-panel {
            display: none;
            padding: 20px 24px;
            background: var(--panel-bg, rgba(30, 30, 50, 0.95));
            border-bottom: 1px solid var(--border);
        }

        .settings-panel.open { display: block; }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .settings-row:last-child { margin-bottom: 0; }

        .settings-row label {
            font-size: 0.82rem;
            color: var(--text-muted);
            min-width: 78px;
        }

        .settings-row input[type="color"] {
            width: 40px;
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: none;
            cursor: pointer;
            padding: 2px;
        }

        .settings-row input[type="text"],
        .settings-row select {
            padding: 6px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.82rem;
            font-family: var(--font);
            outline: none;
            min-width: 150px;
        }

        .settings-row input[type="text"]:focus,
        .settings-row select:focus { border-color: var(--accent); }

        .settings-row select option { background: var(--bg); color: var(--text); }

        .settings-divider {
            flex-basis: 100%;
            height: 1px;
            background: var(--border);
            margin: 4px 0 10px;
        }

        .settings-section-title {
            flex-basis: 100%;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            opacity: 0.75;
            margin-bottom: 4px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            .topbar { padding: 12px 16px; }
            .content { padding: 16px 16px 60px; }
            .page-tabs { padding: 10px 16px; }
            .clock { display: none; }
            .search-box { max-width: none; }
            .logo { display: none; }
        }

        /* ===== Print ===== */
        @media print {
            .topbar, .page-tabs, .widget-actions, .add-widget-card, .add-link-btn, .settings-panel {
                display: none !important;
            }
            body { background: #fff; color: #000; background-image: none; }
            .widgets-grid { height: auto !important; }
            .widget, .add-widget-card {
                position: static !important;
                width: 100% !important;
                left: auto !important;
                top: auto !important;
                margin-bottom: 12px;
            }
            .widget {
                background: #fff;
                border: 1px solid #ddd;
                box-shadow: none;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>

<!-- ===== Top Bar ===== -->
<div class="topbar">
    <div class="topbar-left">
        <div class="logo">⬡ Startpage</div>
        <div class="search-box">
            <span style="color: var(--text-muted); font-size: 0.9rem;">🔍</span>
            <input type="text" id="searchInput" data-i18n-placeholder="search.placeholder" autocomplete="off">
            <select id="searchEngine">
                <optgroup label="Search" data-i18n-label="search.groupSearch">
                    <option value="https://www.google.com/search?q=">Google</option>
                    <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                    <option value="https://www.bing.com/search?q=">Bing</option>
                    <option value="https://search.brave.com/search?q=">Brave</option>
                    <option value="https://www.youtube.com/results?search_query=">YouTube</option>
                    <option value="https://github.com/search?q=">GitHub</option>
                </optgroup>
                <optgroup label="AI" data-i18n-label="search.groupAI">
                    <option value="https://chat.deepseek.com/?q=">DeepSeek</option>
                    <option value="https://gemini.google.com/app?q=">Gemini</option>
                    <option value="https://chat.qwen.ai/?q=">Qwen</option>
                    <option value="https://chatgpt.com/?q=">ChatGPT</option>
                    <option value="https://www.perplexity.ai/search?q=">Perplexity</option>
                    <option value="https://kimi.moonshot.cn/?q=">Kimi</option>

function t(key, vars) {
    const lang = data.settings.lang || 'en';
    const dict = I18N[lang] || I18N.en;
    let str = dict[key] ?? I18N.en[key] ?? key;
    if (vars) {
        for (const k in vars) {
            str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
        }
    }
    return str;
}

function applyLanguage() {
    const lang = data.settings.lang || 'en';
    document.documentElement.lang =
        lang === 'zh-CN' ? 'zh-CN' : (lang === 'zh-TW' ? 'zh-TW' : 'en');

    document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
    });
    document.querySelectorAll('[data-i18n-label]').forEach(el => {
        el.label = t(el.dataset.i18nLabel);
    });
}

/* ============================================================
   5. PERSISTENCE
   ============================================================ */
function loadData() {
    try {
        const raw = localStorage.getItem('startpage-data-v1');
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.pages && Array.isArray(parsed.pages) && parsed.pages.length > 0) {
                if (!parsed.settings) parsed.settings = {};
                const def = DEFAULT_DATA.settings;
                for (const k in def) {
                    if (parsed.settings[k] === undefined) parsed.settings[k] = def[k];
                }
                // 補上舊資料缺少的 view 欄位
                parsed.pages.forEach(p => {
                    (p.widgets || []).forEach(w => {
                        if (!w.view) w.view = 'list';
                    });
                });
                return parsed;
            }
        }
    } catch (e) {
        console.warn('Failed to load data, using defaults.', e);
    }
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData() {
    try {
        localStorage.setItem('startpage-data-v1', JSON.stringify(data));
    } catch (e) {
        toast(t('common.toastSaveFailed'));
    }
}

function uid(prefix = 'id') {
    return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function currentPage() {
    if (!data.pages[activePageIndex]) activePageIndex = 0;
    return data.pages[activePageIndex];

function updateClock() {

/* ============================================================
   7. COLOUR HELPERS
   ============================================================ */
function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : null;
}

function lighten(hex, amount) {
    const rgb = hexToRgb(hex);
    if (!rgb) return hex;
    const clamp = v => Math.max(0, Math.min(255, v + amount));
    return '#' + [clamp(rgb.r), clamp(rgb.g), clamp(rgb.b)]
        .map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ============================================================
   8. APPLY THEME
   ============================================================ */
function applyTheme() {
    const s = data.settings;
    const theme = THEMES[s.theme] || THEMES.dark;

    for (const k in theme.vars) {
        document.documentElement.style.setProperty(k, theme.vars[k]);
    }
    document.body.dataset.light = theme.light ? '1' : '0';

    if (s.accentColor) {
        document.documentElement.style.setProperty('--accent', s.accentColor);
        document.documentElement.style.setProperty('--accent-hover', lighten(s.accentColor, 20));
    }
    if (s.bgColor) {
        document.documentElement.style.setProperty('--bg', s.bgColor);
        const rgb = hexToRgb(s.bgColor);
        if (rgb) {
            const isLight = (rgb.r + rgb.g + rgb.b) / 3 > 160;
            document.body.dataset.light = isLight ? '1' : '0';
        }
    }

    document.title = s.pageTitle || 'My Startpage';
    document.getElementById('pageTitleInput').value = s.pageTitle || '';
    document.getElementById('accentColorPicker').value = s.accentColor;
    document.getElementById('bgColorPicker').value = s.bgColor;
    document.getElementById('themeSelect').value = s.theme || 'dark';
    document.getElementById('langSelect').value = s.lang || 'en';
    document.getElementById('defaultViewSelect').value = s.defaultView || 'list';

    const sel = document.getElementById('searchEngine');
    const values = Array.from(sel.options).map(o => o.value);
    if (values.includes(s.searchEngine)) sel.value = s.searchEngine;
    else { sel.selectedIndex = 0; s.searchEngine = sel.value; }
}

/* ============================================================
   9. MASONRY LAYOUT
   ============================================================ */
const MASONRY_GAP = 20;
const MASONRY_MIN_COL = 300;
const MASONRY_MIN_COL_WIDE = 340;

function layoutMasonry() {
    const grid = document.getElementById('widgetsGrid');
    if (!grid) return;

    const items = Array.from(grid.children);
    if (!items.length) {
        grid.style.height = '0px';
        return;
    }

    const containerWidth = grid.clientWidth;
    if (containerWidth <= 0) return;

    const minCol = window.innerWidth >= 1200 ? MASONRY_MIN_COL_WIDE : MASONRY_MIN_COL;
    let cols = Math.floor((containerWidth + MASONRY_GAP) / (minCol + MASONRY_GAP));
    cols = Math.max(1, cols);

    const colWidth = (containerWidth - MASONRY_GAP * (cols - 1)) / cols;

    for (let i = 0; i < items.length; i++) {
        const el = items[i];
        el.style.position = 'absolute';
        el.style.left = '0px';
        el.style.top = '0px';
        el.style.width = colWidth + 'px';
    }

    const heightsMeasured = items.map(el => el.offsetHeight);

    const colHeights = new Array(cols).fill(0);
    for (let i = 0; i < items.length; i++) {
        const el = items[i];
        const h = heightsMeasured[i];

        let shortest = 0;
        for (let c = 1; c < cols; c++) {
            if (colHeights[c] < colHeights[shortest]) shortest = c;
        }

        el.style.left = (shortest * (colWidth + MASONRY_GAP)) + 'px';
        el.style.top = colHeights[shortest] + 'px';

        colHeights[shortest] += h + MASONRY_GAP;
    }

    const totalHeight = Math.max(0, Math.max(...colHeights) - MASONRY_GAP);
    grid.style.height = totalHeight + 'px';
}

let layoutRaf = null;
function scheduleLayout() {
    if (layoutRaf) cancelAnimationFrame(layoutRaf);
    layoutRaf = requestAnimationFrame(() => {
        layoutRaf = null;
        layoutMasonry();
    });
}

function applyWidgetColor(card, color) {

    if (c) {
        card.style.setProperty('--w-color', color);
        card.style.borderColor = `rgba(${c.r}, ${c.g}, ${c.b}, 0.4)`;
        card.style.background =
            `linear-gradient(160deg, rgba(${c.r}, ${c.g}, ${c.b}, 0.16), rgba(${c.r}, ${c.g}, ${c.b}, 0.035) 65%), var(--surface)`;
        card.dataset.hasColor = '1';
    } else {
        card.style.removeProperty('--w-color');
        card.style.borderColor = '';
        card.style.background = '';
        card.dataset.hasColor = '0';
    }
}

function setWidgetColor(widgetId, color, silent) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget) return;
    if (color) widget.color = color;
    else delete widget.color;
    saveData();
    const card = document.querySelector(`.widget[data-widget-id="${widgetId}"]`);
    if (card) applyWidgetColor(card, color);
    if (!silent) toast(t('widget.colourUpdated'));
}

function closeColorPop() {
    if (colorPopEl) {
        colorPopEl.remove();
        colorPopEl = null;
        document.removeEventListener('mousedown', outsideColorPop);
        window.removeEventListener('resize', closeColorPop);
        window.removeEventListener('scroll', closeColorPop, true);
    }
}

function outsideColorPop(e) {
    if (!colorPopEl) return;
    if (colorPopEl.contains(e.target)) return;
    if (e.target.closest && e.target.closest('[data-action="color"]')) return;
    closeColorPop();
}

function openColorPop(anchor, widgetId) {
    const wasOpen = colorPopEl !== null;
    closeColorPop();
    if (wasOpen) return;

    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget) return;

    const pop = document.createElement('div');
    pop.className = 'color-pop';
    pop.innerHTML = `
        <div class="color-pop-title">${escapeHtml(t('widget.colourTitle'))}</div>
        <div class="color-pop-grid">
            ${WIDGET_COLORS.map(c =>
                `<button class="swatch${widget.color === c ? ' active' : ''}" data-color="${c}" style="--sw:${c}" title="${c}"></button>`
            ).join('')}
        </div>
        <div class="color-pop-actions">
            <label class="swatch-custom">
                <input type="color" value="${widget.color || data.settings.accentColor}">
                <span>${escapeHtml(t('widget.customColour'))}</span>
            </label>
            <button class="swatch-reset" data-color="">${escapeHtml(t('widget.resetColour'))}</button>
        </div>
    `;
    document.body.appendChild(pop);

    const r = anchor.getBoundingClientRect();
    const w = 216;
    let left = Math.min(r.left, window.innerWidth - w - 12);
    left = Math.max(12, left);
    let top = r.bottom + 8;
    if (top + 200 > window.innerHeight) top = Math.max(12, r.top - 210);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    pop.querySelectorAll('.swatch[data-color]').forEach(btn => {
        btn.addEventListener('click', () => {
            setWidgetColor(widgetId, btn.dataset.color);
            closeColorPop();
        });
    });

    pop.querySelector('.swatch-reset').addEventListener('click', () => {
        setWidgetColor(widgetId, '');
        closeColorPop();
    });

    pop.querySelector('input[type=color]').addEventListener('input', (e) => {
        setWidgetColor(widgetId, e.target.value, true);
        pop.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    });

    colorPopEl = pop;
    setTimeout(() => {
        document.addEventListener('mousedown', outsideColorPop);
        window.addEventListener('resize', closeColorPop);
        window.addEventListener('scroll', closeColorPop, true);
    }, 0);
}

function applyWidgetView(card, view) {
    card.dataset.view = view || 'list';

    if (btn) {
        const isIcons = (view === 'icons');
        btn.textContent = isIcons ? '▤' : '▦';

function toggleWidgetView(widgetId) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget) return;

    widget.view = (widget.view === 'icons') ? 'list' : 'icons';
    saveData();

    const card = document.querySelector(`.widget[data-widget-id="${widgetId}"]`);
    if (card) {
        applyWidgetView(card, widget.view);
        // 高度變化，重排瀑布流（跑兩次保險）
        scheduleLayout();
        setTimeout(scheduleLayout, 60);
    }

    toast(t('widget.viewSwitched', {
        view: t(widget.view === 'icons' ? 'view.icons' : 'view.list')
    }));
}

function renderTabs() {
    const container = document.getElementById('pageTabs');
    container.innerHTML = '';

    data.pages.forEach((page, i) => {
        const tab = document.createElement('div');
        tab.className = 'page-tab' + (i === activePageIndex ? ' active' : '');
        tab.innerHTML = `<span>${escapeHtml(page.name)}</span>` +
            (data.pages.length > 1 ? `<span class="tab-close" data-page="${i}" title="Delete page">×</span>` : '');
        tab.addEventListener('click', (e) => {
            if (e.target.classList.contains('tab-close')) return;
            activePageIndex = i;
            renderAll();
        });
        tab.querySelector('.tab-close')?.addEventListener('click', (e) => {
            e.stopPropagation();
            deletePage(i);
        });
        tab.addEventListener('dblclick', (e) => {
            if (e.target.classList.contains('tab-close')) return;
            renamePage(i);
        });
        /* ---- Drop widget onto tab = move widget to that page ---- */
        tab.addEventListener('dragover', (e) => {
            if (!dragState.widgetId || i === activePageIndex) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            tab.classList.add('drag-over');
        });
        tab.addEventListener('dragleave', () => tab.classList.remove('drag-over'));
        tab.addEventListener('drop', (e) => {
            e.preventDefault();
            tab.classList.remove('drag-over');
            if (!dragState.widgetId || i === activePageIndex) return;
            moveWidgetToPage(dragState.widgetId, i);
        });
        container.appendChild(tab);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'page-tab-add';
    addBtn.textContent = t('page.addPage');
    addBtn.addEventListener('click', addPage);
    container.appendChild(addBtn);
}

function renderWidgets() {
    const grid = document.getElementById('widgetsGrid');
    grid.innerHTML = '';

    const page = currentPage();
    if (!page) return;

    page.widgets.forEach((widget) => {
        const card = document.createElement('div');
        card.className = 'widget';
        card.dataset.widgetId = widget.id;
        applyWidgetColor(card, widget.color || '');
        applyWidgetView(card, widget.view || 'list');

        /* ---- Header ---- */
        const header = document.createElement('div');
        header.className = 'widget-header';

        const viewIsIcons = (widget.view === 'icons');
        header.innerHTML = `
            <span class="widget-title">${escapeHtml(widget.title)}</span>
            <div class="widget-actions">
                <button class="widget-action" data-action="view" title="${escapeHtml(viewIsIcons ? t('view.toList') : t('view.toIcons'))}">${viewIsIcons ? '▤' : '▦'}</button>
                <button class="widget-action" data-action="color" title="${escapeHtml(t('widget.colourTitle'))}">🎨</button>
                <button class="widget-action" data-action="rename" title="Rename">✏️</button>
                <button class="widget-action delete" data-action="delete" title="Delete">🗑</button>
            </div>
        `;
        header.querySelector('[data-action="view"]').addEventListener('click', (e) => {
            e.stopPropagation(); e.preventDefault();
            toggleWidgetView(widget.id);
        });
        header.querySelector('[data-action="color"]').addEventListener('click', (e) => {
            e.stopPropagation(); e.preventDefault();
            openColorPop(e.currentTarget, widget.id);
        });
        header.querySelector('[data-action="rename"]').addEventListener('click', (e) => {
            e.stopPropagation();
            renameWidget(widget.id);
        });
        header.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteWidget(widget.id);
        });

        // Drag
        header.draggable = true;
        header.addEventListener('dragstart', (e) => {
            closeColorPop();
            dragState = { widgetId: widget.id, fromPage: activePageIndex };
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', widget.id);
        });
        header.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            dragState = { widgetId: null, fromPage: null };
            document.querySelectorAll('.widget').forEach(w => w.classList.remove('drag-over'));
            document.querySelectorAll('.page-tab').forEach(tb => tb.classList.remove('drag-over'));
        });

        card.addEventListener('dragover', (e) => {
            if (!dragState.widgetId) return; /* link 拖曳中唔當 widget drop zone */
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            if (dragState.widgetId && dragState.widgetId !== widget.id) {
                card.classList.add('drag-over');
            }
        });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', (e) => {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (!dragState.widgetId || dragState.widgetId === widget.id) return;
            reorderWidgets(dragState.widgetId, widget.id);
        });

        /* ---- Body ---- */
        const body = document.createElement('div');
        body.className = 'widget-body';

        const linkList = document.createElement('div');
        linkList.className = 'link-list';

        widget.links.forEach((link, li) => {
            const item = document.createElement('a');
            item.className = 'link-item';
            item.href = link.url;
            item.target = '_blank';
            item.rel = 'noopener noreferrer';
            item.title = link.label + '  ·  ' + link.url;
            item.innerHTML = `
                <img class="link-favicon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(getDomain(link.url))}&sz=64"
                     onerror="this.style.visibility='hidden'" alt="">
                <span class="link-label">${escapeHtml(link.label)}</span>
                <span class="link-edit-actions">
                    <button data-action="edit-link" title="${escapeHtml(t('link.editTitle'))}">✏️</button>
                    <button data-action="delete-link" class="del" title="Delete">✕</button>
                </span>
            `;
            item.querySelector('[data-action="edit-link"]').addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                editLink(widget.id, li);
            });
            item.querySelector('[data-action="delete-link"]').addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation();
                deleteLink(widget.id, li);
            });

            /* ---- Link drag-to-reorder ---- */
            item.draggable = true;
            item.addEventListener('dragstart', (e) => {
                closeColorPop();
                linkDrag = { widgetId: widget.id, linkIndex: li, el: item };
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', String(li));
            });
            item.addEventListener('dragend', () => {
                item.classList.remove('dragging');
                linkDrag = null;
                clearLinkPh();
                document.querySelectorAll('.link-item').forEach(el => el.classList.remove('drag-over'));
            });
            linkList.appendChild(item);
        });

        const addLinkBtn = document.createElement('button');
        addLinkBtn.className = 'add-link-btn';
        addLinkBtn.innerHTML = `<span>${escapeHtml(t('link.addLink'))}</span>`;
        addLinkBtn.addEventListener('click', () => addLink(widget.id));
        linkList.appendChild(addLinkBtn);

        /* ---- Link drop zone（同一 widget 內重排） ---- */
        linkList.addEventListener('dragover', (e) => {
            if (!linkDrag || linkDrag.widgetId !== widget.id) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const before = getInsertBeforeEl(linkList, e.clientX, e.clientY);
            const ph = getLinkPh();
            if (before) linkList.insertBefore(ph, before);
            else linkList.insertBefore(ph, addLinkBtn);
        });
        linkList.addEventListener('drop', (e) => {
            if (!linkDrag || linkDrag.widgetId !== widget.id) return;
            e.preventDefault();
            const ph = linkPhEl;
            if (!ph || ph.parentNode !== linkList) return;
            /* 數 placeholder 前「非 placeholder、非被拖」嘅 link 數 = 新 index */
            let idx = 0;
            let node = ph.previousElementSibling;
            while (node) {
                if (!node.classList.contains('drop-ph') && node !== linkDrag.el) idx++;
                node = node.previousElementSibling;
            }
            reorderLinks(widget.id, linkDrag.linkIndex, idx);
            clearLinkPh();
        });

        body.appendChild(linkList);
        card.appendChild(header);
        card.appendChild(body);
        grid.appendChild(card);
    });

    const addCard = document.createElement('button');
    addCard.className = 'add-widget-card';
    addCard.innerHTML = escapeHtml(t('common.addWidget'));
    addCard.addEventListener('click', addWidget);
    grid.appendChild(addCard);

    scheduleLayout();
    setTimeout(scheduleLayout, 80);
    setTimeout(scheduleLayout, 260);
}

function getDomain(url) {
    try { return new URL(url).hostname; } catch { return ''; }
}

function renderAll() {
    closeColorPop();
    renderTabs();
    renderWidgets();
    applyLanguage();
}

/* ============================================================
   13. PAGE CRUD
   ============================================================ */
function addPage() {
    const name = prompt(t('page.pageName'), t('page.newPage'));
    if (!name || !name.trim()) return;
    data.pages.push({ id: uid('page'), name: name.trim(), widgets: [] });
    activePageIndex = data.pages.length - 1;
    saveData();
    renderAll();
    toast(t('page.added'));
}

function renamePage(index) {
    const page = data.pages[index];
    if (!page) return;
    const name = prompt(t('page.rename'), page.name);
    if (!name || !name.trim()) return;
    page.name = name.trim();
    saveData();
    renderAll();
    toast(t('page.renamed'));
}

function deletePage(index) {
    if (data.pages.length <= 1) {
        toast(t('page.cannotDelete'));
        return;
    }
    if (!confirm(t('page.deleteConfirm', { name: data.pages[index].name }))) return;
    data.pages.splice(index, 1);
    if (activePageIndex >= data.pages.length) activePageIndex = data.pages.length - 1;
    saveData();
    renderAll();
    toast(t('page.deleted'));
}

/* ============================================================
   14. WIDGET CRUD
   ============================================================ */
function addWidget() {
    const title = prompt(t('widget.addWidget'), t('widget.newWidget'));
    if (!title || !title.trim()) return;
    const page = currentPage();
    page.widgets.push({
        id: uid('w'),
        title: title.trim(),
        view: data.settings.defaultView || 'list',
        links: []
    });
    saveData();
    renderWidgets();
    toast(t('widget.added'));
}

function renameWidget(widgetId) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget) return;
    const title = prompt(t('widget.rename'), widget.title);
    if (!title || !title.trim()) return;
    widget.title = title.trim();
    saveData();
    renderWidgets();
    toast(t('widget.renamed'));
}

function deleteWidget(widgetId) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget) return;
    if (!confirm(t('widget.deleteConfirm', { name: widget.title }))) return;
    page.widgets = page.widgets.filter(w => w.id !== widgetId);
    saveData();
    renderWidgets();
    toast(t('widget.deleted'));
}

function reorderWidgets(fromId, toId) {
    const page = currentPage();
    const fromIdx = page.widgets.findIndex(w => w.id === fromId);
    const toIdx = page.widgets.findIndex(w => w.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = page.widgets.splice(fromIdx, 1);
    page.widgets.splice(toIdx, 0, moved);
    saveData();
    renderWidgets();
}

/* ============================================================
   14b. DRAG TO PAGE / LINK REORDER
   ============================================================ */

/** 插入點計算：返回要 insertBefore 的 element（null = 插末尾）。
 *  同時支援直列 list 同 icons grid（same-row 用 x，否則用 y） */
function getInsertBeforeEl(container, x, y) {
    const els = Array.from(container.querySelectorAll('.link-item:not(.dragging):not(.drop-ph)'));
    for (const el of els) {
        const b = el.getBoundingClientRect();
        const dy = y - (b.top + b.height / 2);
        const dx = x - (b.left + b.width / 2);
        const sameRow = Math.abs(dy) <= b.height / 2 + 2;
        if (sameRow ? dx < 0 : dy < 0) return el;
    }
    return null;
}

function getLinkPh() {
    if (!linkPhEl) {
        linkPhEl = document.createElement('div');
        linkPhEl.className = 'link-item drop-ph';
    }
    return linkPhEl;
}
function clearLinkPh() {
    if (linkPhEl && linkPhEl.parentNode) linkPhEl.parentNode.removeChild(linkPhEl);
}

/** 將 widget 拖到另一個 page 的 tab 上 → 移過去並切換到該頁 */
function moveWidgetToPage(widgetId, targetPageIndex) {
    const fromPage = data.pages[activePageIndex];
    const toPage = data.pages[targetPageIndex];
    if (!fromPage || !toPage || fromPage === toPage) return;
    const idx = fromPage.widgets.findIndex(w => w.id === widgetId);
    if (idx === -1) return;
    const [moved] = fromPage.widgets.splice(idx, 1);
    toPage.widgets.push(moved);
    activePageIndex = targetPageIndex;
    saveData();
    renderAll();
    toast(t('widget.movedToPage', { name: toPage.name }));
}

/** 同一 widget 內連結重排 */
function reorderLinks(widgetId, fromIdx, toIdx) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget || !widget.links) return;
    if (fromIdx < 0 || fromIdx >= widget.links.length) return;
    const [moved] = widget.links.splice(fromIdx, 1);
    widget.links.splice(Math.max(0, Math.min(toIdx, widget.links.length)), 0, moved);
    saveData();
    renderWidgets();
}

/* ============================================================
   15. LINK CRUD
   ============================================================ */
function addLink(widgetId) {
    showLinkModal(null, (label, url) => {
        const page = currentPage();
        const widget = page.widgets.find(w => w.id === widgetId);
        if (!widget) return;
        widget.links.push({ label, url });
        saveData();
        renderWidgets();
        toast(t('link.added'));
    });
}

function editLink(widgetId, linkIndex) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget || !widget.links[linkIndex]) return;
    const link = widget.links[linkIndex];
    showLinkModal(link, (label, url) => {
        widget.links[linkIndex] = { label, url };
        saveData();
        renderWidgets();
        toast(t('link.updated'));
    });
}

function deleteLink(widgetId, linkIndex) {
    const page = currentPage();
    const widget = page.widgets.find(w => w.id === widgetId);
    if (!widget) return;
    const link = widget.links[linkIndex];
    if (!link) return;
    if (!confirm(t('link.deleteConfirm', { name: link.label }))) return;
    widget.links.splice(linkIndex, 1);
    saveData();
    renderWidgets();
    toast(t('link.deleted'));
}

/* ============================================================
   16. LINK MODAL
   ============================================================ */
function showLinkModal(existingLink, onSave) {
    const overlay = document.getElementById('modalOverlay');
    const content = document.getElementById('modalContent');

    content.innerHTML = `
        <h3>${escapeHtml(existingLink ? t('link.editTitle') : t('link.addTitle'))}</h3>
        <div class="form-group">
            <label>${escapeHtml(t('link.label'))}</label>
            <input type="text" id="modalLinkLabel" value="${existingLink ? escapeHtml(existingLink.label) : ''}" placeholder="${escapeHtml(t('link.labelPlaceholder'))}">
        </div>
        <div class="form-group">
            <label>${escapeHtml(t('link.url'))}</label>
            <input type="text" id="modalLinkUrl" value="${existingLink ? escapeHtml(existingLink.url) : ''}" placeholder="https://...">
        </div>
        <div class="modal-actions">
            <button class="btn" id="modalCancel">${escapeHtml(t('link.cancel'))}</button>
            <button class="btn btn-primary" id="modalSave">${escapeHtml(t('link.save'))}</button>
        </div>
    `;

    overlay.classList.add('open');
    const close = () => overlay.classList.remove('open');

    document.getElementById('modalCancel').addEventListener('click', close);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });

    document.getElementById('modalSave').addEventListener('click', () => {
        const label = document.getElementById('modalLinkLabel').value.trim();
        let url = document.getElementById('modalLinkUrl').value.trim();
        if (!label || !url) { toast(t('link.required')); return; }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        onSave(label, url);
        close();
    });

    content.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modalSave').click(); }
        if (e.key === 'Escape') close();
    });

    setTimeout(() => document.getElementById('modalLinkLabel')?.focus(), 50);
}

/* ============================================================
   17. SETTINGS BINDINGS
   ============================================================ */
function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
}

function bindSettings() {
    document.getElementById('settingsBtn').addEventListener('click', toggleSettings);

    document.getElementById('themeSelect').addEventListener('change', (e) => {
        data.settings.theme = e.target.value;
        const theme = THEMES[data.settings.theme];
        if (theme) {
            data.settings.accentColor = theme.vars['--accent'];
            data.settings.bgColor = theme.vars['--bg'];
        }
        applyTheme();
        saveData();
    });

    document.getElementById('langSelect').addEventListener('change', (e) => {
        data.settings.lang = e.target.value;
        saveData();
        applyLanguage();
        renderAll();
        updateClock();
    });

    document.getElementById('defaultViewSelect').addEventListener('change', (e) => {
        data.settings.defaultView = e.target.value;
        saveData();
    });

    document.getElementById('accentColorPicker').addEventListener('input', (e) => {
        data.settings.accentColor = e.target.value;
        applyTheme();
        saveData();
    });

    document.getElementById('bgColorPicker').addEventListener('input', (e) => {
        data.settings.bgColor = e.target.value;
        applyTheme();
        saveData();
    });

    document.getElementById('pageTitleInput').addEventListener('input', (e) => {
        data.settings.pageTitle = e.target.value;
        document.title = e.target.value || 'My Startpage';
        saveData();
    });

    document.getElementById('searchEngine').addEventListener('change', (e) => {
        data.settings.searchEngine = e.target.value;
        saveData();
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'startpage-data.json';
        a.click();
        URL.revokeObjectURL(url);
        toast(t('settings.exported'));
    });

    document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const parsed = JSON.parse(ev.target.result);
                if (!parsed.pages || !Array.isArray(parsed.pages)) {
                    toast(t('settings.invalidFile'));
                    return;
                }
                data = parsed;
                if (!data.settings) data.settings = JSON.parse(JSON.stringify(DEFAULT_DATA.settings));
                const def = DEFAULT_DATA.settings;
                for (const k in def) if (data.settings[k] === undefined) data.settings[k] = def[k];
                data.pages.forEach(p => (p.widgets || []).forEach(w => {
                    if (!w.view) w.view = 'list';
                }));
                activePageIndex = 0;
                applyTheme();
                saveData();
                renderAll();
                updateClock();
                toast(t('settings.imported'));
            } catch (err) {
                toast(t('settings.parseError'));
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (!confirm(t('settings.confirmReset'))) return;
        localStorage.removeItem('startpage-data-v1');
        data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        activePageIndex = 0;
        applyTheme();
        saveData();
        renderAll();
        updateClock();
        toast(t('settings.resetDone'));
    });
}

/* ============================================================
   18. SEARCH
   ============================================================ */
function isAiEngine(url) {
    return AI_ENGINE_PREFIXES.some(p => url.startsWith(p));
}

function bindSearch() {
    const input = document.getElementById('searchInput');
    const sel = document.getElementById('searchEngine');

    input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;

        const q = input.value.trim();
        if (!q) return;

        const engine = sel.value;
        const engineName = sel.selectedOptions[0]?.textContent || 'AI';

        const isUrl = /^https?:\/\//i.test(q);
        const looksLikeDomain = !isUrl && /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q);

        let target;
        let usedAi = false;

        if (isUrl) {
            target = q;
        } else if (looksLikeDomain) {
            target = 'https://' + q;
        } else {
            target = engine + encodeURIComponent(q);
            usedAi = isAiEngine(engine);
        }

        window.open(target, '_blank', 'noopener');

        if (usedAi) {
            navigator.clipboard?.writeText(q).then(
                () => toast(t('search.aiOpened', { name: engineName })),
                () => toast(t('search.aiOpenedSimple', { name: engineName }))
            );
        }

        input.value = '';
    });
}

/* ============================================================
   19. MISC
   ============================================================ */
function bindAddWidget() {
    document.getElementById('addWidgetBtn').addEventListener('click', addWidget);
}

function bindKeyboard() {
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n') {
            e.preventDefault();
            addPage();
        }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'w') {
            e.preventDefault();
            addWidget();
        }
        if (e.key === 'Escape') {
            document.getElementById('modalOverlay').classList.remove('open');
            closeColorPop();
        }
    });
}

/* ============================================================
   20. UTILS
   ============================================================ */
function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ============================================================
   21. INIT
   ============================================================ */
function init() {
    applyTheme();
    applyLanguage();
    bindSettings();
    bindSearch();
    bindAddWidget();
    bindKeyboard();
    renderAll();
    updateClock();
    setInterval(updateClock, 30000);

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(layoutMasonry, 120);
    });

    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(scheduleLayout);
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
